<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#06132e">
<title>SINAN KP — Personal Dashboard</title>
<style>
:root{--bg:#030a18;--panel:#071831;--panel2:#0a2042;--line:#193b6d;--blue:#2f7cff;--blue2:#64b4ff;--text:#edf4ff;--muted:#9eb4d5;--danger:#ffb4b4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top right,#0b2450 0,transparent 42%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#041027;border-right:1px solid var(--line);padding:24px 15px;display:flex;flex-direction:column;gap:20px}.brand{padding:0 12px 12px}.brand h1{font-size:26px;letter-spacing:1px;color:#4c91ff;margin:0}.brand p{margin:2px 0;color:var(--muted);font-size:13px}.nav{display:grid;gap:6px}.nav button{width:100%;border:1px solid transparent;color:#c7d7f0;background:transparent;text-align:left;padding:11px 12px;border-radius:11px}.nav button:hover,.nav button.active{background:linear-gradient(100deg,#1047a5,#0a2a60);border-color:#2367d8;color:white}.quote{margin-top:auto;border:1px solid var(--line);border-radius:14px;padding:15px;color:#c4d9ff;background:linear-gradient(145deg,#0a2451,#06142b)}.quote strong{display:block;color:#6caaff;margin-bottom:5px}.main{min-width:0}.topbar{height:68px;border-bottom:1px solid #142e52;display:flex;align-items:center;justify-content:space-between;padding:0 26px;gap:14px}.topbar small{color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}.search{width:min(280px,45vw);background:#06152d;border:1px solid var(--line);color:white;border-radius:20px;padding:9px 14px}.content{padding:24px;max-width:1500px;margin:auto}.hero{border:1px solid #1d4b8d;border-radius:18px;padding:30px;background:linear-gradient(105deg,rgba(9,42,93,.98),rgba(4,15,36,.86)),radial-gradient(circle at 85% 30%,#1c5db7,transparent 35%);display:flex;align-items:center;gap:24px;min-height:190px}.avatar{width:92px;height:92px;flex:0 0 92px;border-radius:50%;display:grid;place-items:center;font-size:36px;background:linear-gradient(140deg,#2677ed,#06132c);border:3px solid #3987ff;box-shadow:0 0 25px #1258c455}.hero h2{font-size:clamp(24px,3vw,38px);margin:0 0 3px}.hero p{margin:4px 0;color:#c8dcfb}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#77b6ff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:18px}.card{background:linear-gradient(150deg,rgba(9,29,59,.96),rgba(4,15,32,.98));border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.card h3{margin:0 0 12px;font-size:16px}.stat{display:flex;align-items:center;gap:13px}.stat-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:12px;background:#0b2b5a;color:#6db5ff;font-size:22px}.stat strong{font-size:25px;display:block}.muted{color:var(--muted)}.wide{grid-column:span 2}.full{grid-column:1/-1}.links{display:grid;gap:9px}.linkrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px;border:1px solid #1b3b65;border-radius:10px;background:#06142a}.linkrow a{color:#83beff;text-decoration:none}.btn{border:1px solid #2868c8;background:#1050a9;color:#fff;padding:9px 13px;border-radius:9px}.btn.secondary{background:#081a34;border-color:#294a75;color:#c9dcfa}.btn.danger{background:#321623;border-color:#7b3447}.field{width:100%;border:1px solid #28466f;border-radius:9px;background:#031024;color:#eff6ff;padding:10px;margin:4px 0 10px}.field::placeholder{color:#7892b5}textarea.field{min-height:125px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.note-item,.task-item{padding:10px 0;border-bottom:1px solid #183455;display:flex;gap:10px;align-items:center;justify-content:space-between}.task-item label{display:flex;gap:9px;align-items:center}.task-item input{accent-color:#347dff}.warning{border:1px solid #765d2b;background:#251e0e;color:#ffe3a1;border-radius:11px;padding:12px;margin:10px 0 16px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed #25436b;border-radius:12px}.footer{margin-top:24px;border-top:1px solid #1a3a66;background:#031027;display:grid;grid-template-columns:repeat(3,1fr);padding:22px 12px 26px;text-align:center}.footitem{padding:8px;border-right:1px solid #28456d}.footitem:last-child{border:0}.footicon{color:#4189ff;font-size:22px}.footlabel{font-size:12px;letter-spacing:2px;color:#9bb4d9;margin-top:4px}.footvalue{font-size:20px;font-weight:700;margin-top:4px}.footname{font-size:25px;font-weight:800;color:#4189ff}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.page-title h2{margin:0;font-size:25px}.small{font-size:12px}.hidden{display:none!important}.social-edit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.social-edit label{font-size:13px;color:var(--muted)}.filebox{border:1px dashed #2c5485;border-radius:12px;padding:18px;text-align:center}.preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:12px}.mobile-menu{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;padding:10px 12px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 5px}.brand h1{font-size:20px}.brand p,.quote{display:none}.nav{display:flex;overflow-x:auto;gap:5px}.nav button{white-space:nowrap;width:auto;padding:8px 11px;font-size:13px}.topbar{height:56px;padding:0 15px}.content{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 2}.hero{padding:20px;gap:15px}.avatar{width:66px;height:66px;flex-basis:66px;font-size:28px}.footer{grid-template-columns:1fr;gap:8px}.footitem{border-right:0;border-bottom:1px solid #28456d}.footitem:last-child{border:0}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wide,.full{grid-column:auto}.hero{align-items:flex-start}.hero h2{font-size:24px}.topright .search{width:130px}.social-edit{grid-template-columns:1fr}.content{padding:12px}.card{padding:15px}.footvalue{font-size:18px}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand"><h1>SINAN KP</h1><p>Personal Dashboard</p></div>
  <nav class="nav" id="nav">
    <button class="active" data-page="Dashboard">⌂ &nbsp; Dashboard</button>
    <button data-page="My Photos">▧ &nbsp; My Photos</button>
    <button data-page="Passport / ID Card">▣ &nbsp; Passport / ID Card</button>
    <button data-page="Social Media">◎ &nbsp; Social Media</button>
    <button data-page="Notes">▤ &nbsp; Notes</button>
    <button data-page="Documents">▧ &nbsp; Documents</button>
    <button data-page="To-Do List">☑ &nbsp; To-Do List</button>
    <button data-page="Calendar">▦ &nbsp; Calendar</button>
    <button data-page="Settings">⚙ &nbsp; Settings</button>
  </nav>
  <div class="quote"><strong>✦ A DAILY REMINDER</strong>Discipline today.<br>Success tomorrow.</div>
</aside>
<main class="main">
  <header class="topbar"><small id="crumb">PERSONAL SPACE / DASHBOARD</small><div class="topright"><input id="search" class="search" placeholder="Search this page…" aria-label="Search this page"><span>◉</span></div></header>
  <div class="content" id="content"></div>
  <footer class="footer">
    <div class="footitem"><div class="footicon">▦</div><div class="footlabel">DATE</div><div class="footvalue" id="date">—</div><div class="muted small" id="day"></div></div>
    <div class="footitem"><div class="footicon">◷</div><div class="footlabel">TIME</div><div class="footvalue" id="time">—</div><div class="muted small">Your device local time</div></div>
    <div class="footitem"><div class="footicon">♙</div><div class="footlabel">HEADING NAME</div><div class="footname">Sinan Kp</div><div class="muted small">Personal Dashboard</div></div>
  </footer>
</main>
</div>
<script>
const $=s=>document.querySelector(s);
const get=(k,f)=>{try{return JSON.parse(localStorage.getItem('sinankp_'+k))??f}catch{return f}};
const put=(k,v)=>localStorage.setItem('sinankp_'+k,JSON.stringify(v));
let page='Dashboard', photoUrl='';
const pages={
'Dashboard':`<section class="hero"><div class="avatar">SK</div><div><div class="eyebrow">WELCOME TO YOUR PERSONAL SPACE</div><h2>Welcome back,<br>Sinan Kp</h2><p>Stay focused and keep moving forward.</p><p class="small">✦ Your personal links, notes and plans in one place.</p></div></section>
<div class="grid">
<div class="card stat"><div class="stat-icon">▧</div><div><strong id="statNotes">0</strong><span class="muted">Saved notes</span></div></div>
<div class="card stat"><div class="stat-icon">☑</div><div><strong id="statTasks">0</strong><span class="muted">Open tasks</span></div></div>
<div class="card stat"><div class="stat-icon">◎</div><div><strong>Links</strong><span class="muted">Your social profiles</span></div></div>
<div class="card wide"><h3>Quick Access</h3><div class="links"><button class="linkrow" data-goto="My Photos">My Photos <span>→</span></button><button class="linkrow" data-goto="Passport / ID Card">Passport / ID Card <span>→</span></button><button class="linkrow" data-goto="Notes">Notes <span>→</span></button><button class="linkrow" data-goto="To-Do List">To-Do List <span>→</span></button></div></div>
<div class="card"><h3>Privacy reminder</h3><p class="muted">This is a public-ready visual dashboard. Keep passport scans, ID cards and private notes off any public website.</p><button class="btn secondary" data-goto="Settings">Privacy settings →</button></div>
</div>`,
'My Photos':`<div class="page-title"><h2>My Photos</h2></div><div class="warning">This preview stays in your current browser tab. Do not publish personal or sensitive photos on a public site.</div><div class="card"><h3>Preview a photo locally</h3><div class="filebox"><p class="muted">Choose an image from your device to preview here. It is not uploaded to a server.</p><input id="photoFile" type="file" accept="image/*" class="field"><div id="photoPreview"></div></div></div>`,
'Passport / ID Card':`<div class="page-title"><h2>Passport / ID Card</h2></div><div class="warning">Important: do not add passport or ID scans to a public website. Anyone may be able to copy them. Store sensitive documents in a secure, private location instead.</div><div class="card"><h3>Secure document checklist</h3><p class="muted">Use this page as a reminder only; it does not store document images or numbers.</p><div id="docChecklist"></div></div>`,
'Social Media':`<div class="page-title"><h2>Social Media</h2><button class="btn" id="saveSocial">Save links</button></div><div class="card"><p class="muted">Add public profile URLs. Never enter passwords or recovery codes.</p><div class="social-edit" id="socialFields"></div></div><div class="card" style="margin-top:14px"><h3>Your profile links</h3><div id="socialList" class="links"></div></div>`,
'Notes':`<div class="page-title"><h2>Notes</h2></div><div class="warning">Notes are saved in this browser on this device only. They are not encrypted, synced, or protected by a login. Do not save passwords, financial details, or private information here.</div><div class="card"><label for="noteTitle">Note title</label><input id="noteTitle" class="field" placeholder="e.g. Ideas"><label for="noteBody">Note</label><textarea id="noteBody" class="field" placeholder="Write a note…"></textarea><button class="btn" id="addNote">Save note on this device</button></div><div class="card" style="margin-top:14px"><h3>Saved notes on this device</h3><div id="notesList"></div></div>`,
'Documents':`<div class="page-title"><h2>Documents</h2></div><div class="warning">Public sites are not a safe place for personal documents. This page intentionally does not upload files to a server.</div><div class="card"><h3>Document organization</h3><p class="muted">Keep documents in a trusted private cloud account or encrypted local storage. Use this page for non-sensitive reminders only.</p><ul class="muted"><li>Keep a backup of important files.</li><li>Use unique passwords and two-factor authentication.</li><li>Never share document links publicly.</li></ul></div>`,
'To-Do List':`<div class="page-title"><h2>To-Do List</h2></div><div class="card"><label for="taskText">New task</label><div class="row"><input id="taskText" class="field" style="flex:1;margin-bottom:0" placeholder="What do you need to do?"><button class="btn" id="addTask">Add task</button></div><div id="taskList" style="margin-top:12px"></div></div>`,
'Calendar':`<div class="page-title"><h2>Calendar</h2></div><div class="card"><h3 id="monthTitle"></h3><div class="row" style="justify-content:space-between"><button class="btn secondary" id="prevMonth">← Previous</button><button class="btn secondary" id="nextMonth">Next →</button></div><div id="calendarGrid" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:15px"></div></div><div class="card" style="margin-top:14px"><h3>Add a reminder</h3><input id="eventDate" type="date" class="field"><input id="eventText" class="field" placeholder="Reminder"><button class="btn" id="addEvent">Save reminder on this device</button><div id="eventList"></div></div>`,
'Settings':`<div class="page-title"><h2>Settings</h2></div><div class="card"><h3>Website information</h3><p><b>Display name:</b> Sinan Kp</p><p><b>Theme:</b> Dark navy blue</p><p><b>Footer:</b> Live device date and time</p><p><b>Hosting mode:</b> Static website</p></div><div class="warning"><b>Public means public.</b> A static website has no real password protection. Do not publish passport scans, ID cards, personal photos, or private notes. This demo stores notes and tasks in this browser's local storage only; that is not secure storage and does not sync between devices.</div><div class="card"><h3>Local data</h3><p class="muted">Clear saved notes, tasks and reminders from this browser. This cannot remove files already copied or published elsewhere.</p><button class="btn danger" id="clearData">Clear local notes, tasks and reminders</button></div>`
};
function navigate(p){page=p;$('#crumb').textContent='PERSONAL SPACE / '+p.toUpperCase();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#content').innerHTML=pages[p]||pages.Dashboard;bindPage();if($('#search'))$('#search').value='';}
function refreshStats(){const notes=get('notes',[]),tasks=get('tasks',[]);const n=$('#statNotes'),t=$('#statTasks');if(n)n.textContent=notes.length;if(t)t.textContent=tasks.filter(x=>!x.done).length}
function bindPage(){
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>navigate(b.dataset.goto));
if(page==='My Photos'){$('#photoFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const url=URL.createObjectURL(f);$('#photoPreview').innerHTML=`<img class="preview" alt="Local image preview" src="${url}"><p class="muted small">Preview only — not uploaded.</p>`}}
if(page==='Passport / ID Card'){const items=['Passport expiry date checked','ID card expiry date checked','Secure backup available'];$('#docChecklist').innerHTML=items.map((x,i)=>`<div class="task-item"><label><input type="checkbox" data-check="${i}"> ${x}</label></div>`).join('')}
if(page==='Social Media'){const names=['Instagram','Facebook','YouTube','X / Twitter','Telegram','Website'];const saved=get('social',{});$('#socialFields').innerHTML=names.map(n=>`<label>${n}<input class="field" data-social="${n}" placeholder="https://…" value="${escapeAttr(saved[n]||'')}"></label>`).join('');$('#saveSocial').onclick=()=>{const obj={};document.querySelectorAll('[data-social]').forEach(i=>obj[i.dataset.social]=i.value.trim());put('social',obj);renderSocial();};renderSocial()}
if(page==='Notes'){renderNotes();$('#addNote').onclick=()=>{const title=$('#noteTitle').value.trim(),body=$('#noteBody').value.trim();if(!title&&!body)return;const arr=get('notes',[]);arr.unshift({id:Date.now(),title:title||'Untitled',body});put('notes',arr);$('#noteTitle').value='';$('#noteBody').value='';renderNotes();refreshStats()}}
if(page==='To-Do List'){renderTasks();$('#addTask').onclick=()=>{const s=$('#taskText').value.trim();if(!s)return;const a=get('tasks',[]);a.push({id:Date.now(),text:s,done:false});put('tasks',a);$('#taskText').value='';renderTasks();refreshStats()};$('#taskText').onkeydown=e=>{if(e.key==='Enter')$('#addTask').click()}}
if(page==='Calendar'){let view=new Date();function draw(){const y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();$('#monthTitle').textContent=view.toLocaleDateString(undefined,{month:'long',year:'numeric'});const labels=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];$('#calendarGrid').innerHTML=labels.map(d=>`<div class="muted small" style="text-align:center">${d}</div>`).join('')+Array.from({length:first},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>`<div style="padding:8px 2px;text-align:center;border:1px solid #1a3c68;border-radius:7px;background:${new Date().toDateString()===new Date(y,m,i+1).toDateString()?'#124a9d':'#06152c'}">${i+1}</div>`).join('');}draw();$('#prevMonth').onclick=()=>{view.setMonth(view.getMonth()-1);draw()};$('#nextMonth').onclick=()=>{view.setMonth(view.getMonth()+1);draw()};renderEvents();$('#addEvent').onclick=()=>{const d=$('#eventDate').value,t=$('#eventText').value.trim();if(!d||!t)return;const a=get('events',[]);a.push({id:Date.now(),date:d,text:t});put('events',a);$('#eventText').value='';renderEvents()}}
if(page==='Settings')$('#clearData').onclick=()=>{if(confirm('Clear local notes, tasks and reminders in this browser?')){['notes','tasks','events'].forEach(k=>localStorage.removeItem('sinankp_'+k));bindPage();refreshStats()}}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
function renderNotes(){const a=get('notes',[]);$('#notesList').innerHTML=a.length?a.map(n=>`<div class="note-item"><div><b>${escapeHtml(n.title)}</b><div class="muted">${escapeHtml(n.body)}</div></div><button class="btn secondary" data-delnote="${n.id}">Delete</button></div>`).join(''):'<div class="empty">No notes saved yet.</div>';document.querySelectorAll('[data-delnote]').forEach(b=>b.onclick=()=>{put('notes',get('notes',[]).filter(n=>n.id!=b.dataset.delnote));renderNotes();refreshStats()})}
function renderTasks(){const a=get('tasks',[]);$('#taskList').innerHTML=a.length?a.map(t=>`<div class="task-item"><label><input type="checkbox" data-task="${t.id}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#8aa1c1':''}">${escapeHtml(t.text)}</span></label><button class="btn secondary" data-deltask="${t.id}">×</button></div>`).join(''):'<div class="empty">Nothing on your list yet.</div>';document.querySelectorAll('[data-task]').forEach(c=>c.onchange=()=>{const a=get('tasks',[]);const t=a.find(x=>x.id==c.dataset.task);if(t)t.done=c.checked;put('tasks',a);renderTasks();refreshStats()});document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=()=>{put('tasks',get('tasks',[]).filter(t=>t.id!=b.dataset.deltask));renderTasks();refreshStats()})}
function renderSocial(){const a=get('social',{});const entries=Object.entries(a).filter(([k,v])=>v);$('#socialList').innerHTML=entries.length?entries.map(([k,v])=>{let valid=/^https?:\/\//i.test(v);return `<div class="linkrow"><span>${escapeHtml(k)}</span>${valid?`<a href="${escapeAttr(v)}" target="_blank" rel="noopener noreferrer">Open ↗</a>`:`<span class="muted small">${escapeHtml(v)}</span>`}</div>`}).join(''):'<div class="empty">Add your profile URLs above.</div>'}
function renderEvents(){const a=get('events',[]).sort((x,y)=>x.date.localeCompare(y.date));$('#eventList').innerHTML=a.length?a.map(e=>`<div class="note-item"><div><b>${escapeHtml(e.date)}</b><div>${escapeHtml(e.text)}</div></div><button class="btn secondary" data-delev="${e.id}">Delete</button></div>`).join(''):'<p class="muted">No reminders saved.</p>';document.querySelectorAll('[data-delev]').forEach(b=>b.onclick=()=>{put('events',get('events',[]).filter(e=>e.id!=b.dataset.delev));renderEvents()})}
function tick(){const d=new Date();$('#date').textContent=d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});$('#day').textContent=d.toLocaleDateString(undefined,{weekday:'long'});$('#time').textContent=d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
$('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$('#content').querySelectorAll('.card,.hero').forEach(el=>el.classList.toggle('hidden',q&&!el.innerText.toLowerCase().includes(q)))});
tick();setInterval(tick,1000);navigate('Dashboard');refreshStats();
</script>
</body>
</html>
